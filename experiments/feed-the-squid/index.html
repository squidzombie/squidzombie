<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed the Squid — SQUIDZOMBIE specimen 003</title>
  <meta name="description" content="An arcade snack break. The zombie squid follows your cursor — eat the glowing plankton, dodge the jellyfish.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦑</text></svg>">
  <style>
    :root {
      --abyss: #050a12;
      --ink: #dff7ef;
      --ink-dim: #8fb3a9;
      --biolume: #3dfbd8;
      --zombie: #8aff5a;
      --violet: #8a6cff;
      --danger: #ff5a8a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 50% 120%, #0e1c2e 0%, var(--abyss) 65%);
      font-family: "Space Grotesk", system-ui, sans-serif;
      color: var(--ink);
    }
    #sea { position: fixed; inset: 0; cursor: none; touch-action: none; }
    .hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1.1rem 1.4rem;
      pointer-events: none;
    }
    .hud button { pointer-events: auto; }
    .hud-left .tag { font-size: 0.68rem; letter-spacing: 0.24em; color: var(--violet); }
    .hud-left h1 {
      font-family: "Rubik Glitch", monospace;
      font-size: 1.5rem;
      color: var(--biolume);
      text-shadow: 0 0 24px rgba(61, 251, 216, 0.5);
      letter-spacing: 0.04em;
    }
    .hud-left .hint { color: var(--ink-dim); font-size: 0.82rem; margin-top: 0.3rem; }
    .hud-right { display: flex; gap: 0.6rem; align-items: center; }
    .score-box { text-align: right; margin-right: 0.4rem; }
    .score-box .score {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--zombie);
      text-shadow: 0 0 16px rgba(138, 255, 90, 0.5);
    }
    .score-box .best { font-size: 0.72rem; color: var(--ink-dim); letter-spacing: 0.1em; }
    .lives { font-size: 1rem; letter-spacing: 0.2em; }
    .hud button {
      font-family: inherit;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      color: var(--biolume);
      background: rgba(61, 251, 216, 0.07);
      border: 1px solid rgba(61, 251, 216, 0.25);
      border-radius: 999px;
      padding: 0.45rem 1rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .hud button:hover { border-color: var(--biolume); background: rgba(61, 251, 216, 0.14); }
    .back {
      position: fixed;
      bottom: 1.1rem; left: 1.4rem;
      color: var(--ink-dim);
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      z-index: 3;
    }
    .back:hover { color: var(--biolume); }
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: rgba(5, 10, 18, 0.72);
      backdrop-filter: blur(4px);
      z-index: 2;
      text-align: center;
      padding: 2rem;
    }
    .overlay.hidden { display: none; }
    .overlay h2 {
      font-family: "Rubik Glitch", monospace;
      font-size: clamp(2rem, 7vw, 3.4rem);
      color: var(--biolume);
      text-shadow: 0 0 32px rgba(61, 251, 216, 0.5);
    }
    .overlay p { color: var(--ink-dim); max-width: 46ch; line-height: 1.7; }
    .overlay .big-score { font-size: 2.4rem; font-weight: 700; color: var(--zombie); }
    .overlay button {
      font-family: inherit;
      font-size: 1rem;
      letter-spacing: 0.05em;
      padding: 0.85rem 2rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: var(--biolume);
      color: var(--abyss);
      box-shadow: 0 0 28px rgba(61, 251, 216, 0.45);
      font-weight: 700;
    }
    .overlay button:hover { box-shadow: 0 0 40px rgba(61, 251, 216, 0.7); }
  </style>
</head>
<body>
  <canvas id="sea"></canvas>

  <div class="hud">
    <div class="hud-left">
      <div class="tag">SPECIMEN 003</div>
      <h1>FEED THE SQUID</h1>
      <div class="hint">it follows your cursor &middot; eat the glow &middot; dodge the jellies</div>
    </div>
    <div class="hud-right">
      <div class="score-box">
        <div class="score" id="score">0</div>
        <div class="best">BEST <span id="best">0</span></div>
      </div>
      <div class="lives" id="lives">🦑🦑🦑</div>
      <button id="sound">sound: on</button>
    </div>
  </div>

  <a class="back" href="../../">&larr; back to the surface</a>

  <div class="overlay" id="overlay">
    <h2 id="overlay-title">FEED THE SQUID</h2>
    <p id="overlay-text">
      The squid is hungry. It goes where your cursor goes. Glowing plankton
      is dinner; jellyfish are regret. Three stings and the deep reclaims you.
    </p>
    <div class="big-score hidden" id="overlay-score"></div>
    <button id="start">begin the feeding</button>
  </div>

  <script>
    const canvas = document.getElementById("sea");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const livesEl = document.getElementById("lives");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const overlayText = document.getElementById("overlay-text");
    const overlayScore = document.getElementById("overlay-score");

    let W, H;
    function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
    addEventListener("resize", resize);
    resize();

    // --- audio ---------------------------------------------------------
    let audioCtx = null, soundOn = true;
    function ensureAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    }
    function blip(freq, dur = 0.18, vol = 0.1, type = "sine") {
      if (!soundOn || !audioCtx) return;
      const t0 = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.5, t0 + dur);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }
    function hurtSound() {
      if (!soundOn || !audioCtx) return;
      const t0 = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(160, t0);
      osc.frequency.exponentialRampToValueAtTime(50, t0 + 0.4);
      g.gain.setValueAtTime(0.12, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.45);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(t0); osc.stop(t0 + 0.5);
    }

    // --- state ---------------------------------------------------------
    const PENTA = [392, 440, 494, 587, 659, 784];   // pentatonic-ish ladder
    let state = "start";                            // start | play | over
    let score = 0, lives = 3, combo = 0, comboTime = 0;
    let best = 0;
    try { best = Number(localStorage.getItem("squid-best") || 0); } catch (e) {}
    bestEl.textContent = best;

    const squid = { x: innerWidth / 2, y: innerHeight / 2, vx: 0, vy: 0, angle: 0, hurt: 0 };
    const target = { x: innerWidth / 2, y: innerHeight / 2 };
    const plankton = [], jellies = [], pops = [];
    let plankTimer = 0, jellyTimer = 0, shake = 0;

    // tentacles: chains of points that follow the head
    const TENTS = 7, SEGS = 11, SEGLEN = 11;
    const tents = Array.from({ length: TENTS }, (_, i) => ({
      spread: (i - (TENTS - 1) / 2) * 0.24,
      pts: Array.from({ length: SEGS }, () => ({ x: squid.x, y: squid.y })),
    }));

    function reset() {
      score = 0; lives = 3; combo = 0;
      plankton.length = 0; jellies.length = 0; pops.length = 0;
      plankTimer = 0; jellyTimer = 2;
      squid.x = W / 2; squid.y = H / 2; squid.vx = squid.vy = 0; squid.hurt = 0;
      scoreEl.textContent = "0";
      livesEl.textContent = "🦑🦑🦑";
    }

    // --- spawning ------------------------------------------------------
    function spawnPlankton() {
      plankton.push({
        x: 40 + Math.random() * (W - 80),
        y: 40 + Math.random() * (H - 80),
        r: 5 + Math.random() * 3,
        phase: Math.random() * Math.PI * 2,
        color: Math.random() < 0.5 ? "61, 251, 216" : "138, 255, 90",
      });
    }
    function spawnJelly() {
      const fromLeft = Math.random() < 0.5;
      const speed = (0.6 + Math.random() * 0.7) * (1 + score / 40);
      jellies.push({
        x: fromLeft ? -40 : W + 40,
        y: 60 + Math.random() * (H - 160),
        vx: fromLeft ? speed : -speed,
        phase: Math.random() * Math.PI * 2,
        r: 17 + Math.random() * 8,
      });
    }

    // --- drawing helpers ----------------------------------------------
    function drawSquid(t) {
      const speed = Math.hypot(squid.vx, squid.vy);
      if (speed > 0.5) {
        const targetAngle = Math.atan2(squid.vy, squid.vx);
        let d = targetAngle - squid.angle;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        squid.angle += d * 0.15;
      }
      const a = squid.angle;
      const back = { x: squid.x - Math.cos(a) * 16, y: squid.y - Math.sin(a) * 16 };

      // tentacles trail behind the head
      for (const tent of tents) {
        const anchorA = a + Math.PI + tent.spread;
        tent.pts[0].x = back.x + Math.cos(anchorA) * 6;
        tent.pts[0].y = back.y + Math.sin(anchorA) * 6;
        for (let i = 1; i < SEGS; i++) {
          const p = tent.pts[i], q = tent.pts[i - 1];
          const dx = p.x - q.x, dy = p.y - q.y;
          const dist = Math.hypot(dx, dy) || 1;
          const sway = Math.sin(t * 3 + i + tent.spread * 8) * 0.6;
          p.x = q.x + (dx / dist) * SEGLEN + sway * 0.4;
          p.y = q.y + (dy / dist) * SEGLEN + sway * 0.4 + 0.25; // slight droop
        }
        ctx.beginPath();
        ctx.moveTo(tent.pts[0].x, tent.pts[0].y);
        for (let i = 1; i < SEGS; i++) ctx.lineTo(tent.pts[i].x, tent.pts[i].y);
        ctx.strokeStyle = squid.hurt > 0 && Math.floor(t * 10) % 2
          ? "rgba(255, 90, 138, 0.8)" : "rgba(42, 167, 139, 0.85)";
        ctx.lineWidth = 4.5;
        ctx.lineCap = "round";
        ctx.stroke();
      }

      // mantle
      ctx.save();
      ctx.translate(squid.x, squid.y);
      ctx.rotate(a + Math.PI / 2);
      const flash = squid.hurt > 0 && Math.floor(t * 10) % 2;
      const grad = ctx.createRadialGradient(0, -8, 4, 0, 0, 34);
      grad.addColorStop(0, flash ? "#ffb3c8" : "#9df7e2");
      grad.addColorStop(0.6, flash ? "#ff5a8a" : "#3ecfae");
      grad.addColorStop(1, flash ? "#8a1f3d" : "#1a7a66");
      ctx.beginPath();
      ctx.ellipse(0, -6, 17, 26, 0, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.shadowColor = "rgba(61, 251, 216, 0.6)";
      ctx.shadowBlur = 18;
      ctx.fill();
      ctx.shadowBlur = 0;

      // zombie stitch
      ctx.strokeStyle = "#0d3d33";
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(-9, -16); ctx.quadraticCurveTo(0, -12, 9, -16); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-5, -19); ctx.lineTo(-4, -12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(3, -18); ctx.lineTo(4, -11); ctx.stroke();

      // eyes — pupils aim at the nearest snack
      let ex = 0, ey = 1;
      let nearest = null, nd = Infinity;
      for (const p of plankton) {
        const d = Math.hypot(p.x - squid.x, p.y - squid.y);
        if (d < nd) { nd = d; nearest = p; }
      }
      if (nearest) {
        const na = Math.atan2(nearest.y - squid.y, nearest.x - squid.x) - (a + Math.PI / 2);
        ex = Math.cos(na); ey = Math.sin(na);
      }
      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(side * 8, 2, 6.5, 0, Math.PI * 2);
        ctx.fillStyle = "#f4fff9";
        ctx.fill();
        ctx.beginPath();
        ctx.arc(side * 8 + ex * 2.6, 2 + ey * 2.6, 3, 0, Math.PI * 2);
        ctx.fillStyle = "#0b1420";
        ctx.fill();
      }
      // droopy zombie eyelid on the right eye
      ctx.beginPath();
      ctx.arc(8, 0.4, 6.8, Math.PI, Math.PI * 1.85);
      ctx.lineTo(8, 0.4);
      ctx.closePath();
      ctx.fillStyle = flash ? "#ff5a8a" : "#2aa78b";
      ctx.fill();
      ctx.restore();
    }

    function drawJelly(j, t) {
      const bob = Math.sin(t * 2 + j.phase) * 8;
      ctx.save();
      ctx.translate(j.x, j.y + bob);
      // threads
      ctx.strokeStyle = "rgba(255, 90, 138, 0.5)";
      ctx.lineWidth = 1.6;
      for (let k = -2; k <= 2; k++) {
        ctx.beginPath();
        ctx.moveTo(k * j.r * 0.3, j.r * 0.3);
        ctx.quadraticCurveTo(
          k * j.r * 0.4 + Math.sin(t * 4 + k + j.phase) * 5, j.r * 1.4,
          k * j.r * 0.35 + Math.sin(t * 3 + k) * 8, j.r * 2.3
        );
        ctx.stroke();
      }
      // dome
      ctx.beginPath();
      ctx.arc(0, 0, j.r, Math.PI, 0);
      ctx.quadraticCurveTo(j.r * 0.6, j.r * 0.55, 0, j.r * 0.5);
      ctx.quadraticCurveTo(-j.r * 0.6, j.r * 0.55, -j.r, 0);
      ctx.fillStyle = "rgba(255, 90, 138, 0.6)";
      ctx.shadowColor = "rgba(255, 90, 138, 0.8)";
      ctx.shadowBlur = 16;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // --- main loop -----------------------------------------------------
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const t = now / 1000;

      ctx.clearRect(0, 0, W, H);
      ctx.save();
      if (shake > 0) {
        shake -= dt * 3;
        ctx.translate((Math.random() - 0.5) * shake * 14, (Math.random() - 0.5) * shake * 14);
      }

      if (state === "play") {
        // squid physics: spring toward cursor
        squid.vx += (target.x - squid.x) * 0.045;
        squid.vy += (target.y - squid.y) * 0.045;
        squid.vx *= 0.88; squid.vy *= 0.88;
        squid.x += squid.vx; squid.y += squid.vy;

        if (squid.hurt > 0) squid.hurt -= dt;
        if (comboTime > 0) { comboTime -= dt; } else { combo = 0; }

        // plankton lifecycle
        plankTimer -= dt;
        if (plankTimer <= 0 && plankton.length < 8) {
          spawnPlankton();
          plankTimer = 0.7 + Math.random() * 0.7;
        }
        for (let i = plankton.length - 1; i >= 0; i--) {
          const p = plankton[i];
          p.x += Math.sin(t * 1.5 + p.phase) * 0.3;
          p.y += Math.cos(t * 1.2 + p.phase) * 0.25;
          if (Math.hypot(p.x - squid.x, p.y - squid.y) < 30) {
            plankton.splice(i, 1);
            combo = Math.min(combo + 1, PENTA.length);
            comboTime = 2;
            score += combo;
            scoreEl.textContent = score;
            blip(PENTA[combo - 1], 0.16, 0.11);
            pops.push({ x: p.x, y: p.y, text: "+" + combo, alpha: 1, color: p.color });
          }
        }

        // jellyfish lifecycle
        jellyTimer -= dt;
        const maxJellies = Math.min(7, 2 + Math.floor(score / 15));
        if (jellyTimer <= 0 && jellies.length < maxJellies) {
          spawnJelly();
          jellyTimer = 2.2 + Math.random() * 2;
        }
        for (let i = jellies.length - 1; i >= 0; i--) {
          const j = jellies[i];
          j.x += j.vx;
          if (j.x < -80 || j.x > W + 80) { jellies.splice(i, 1); continue; }
          if (squid.hurt <= 0 &&
              Math.hypot(j.x - squid.x, j.y + Math.sin(t * 2 + j.phase) * 8 - squid.y) < j.r + 20) {
            lives--;
            squid.hurt = 2;
            combo = 0;
            shake = 1;
            hurtSound();
            livesEl.textContent = "🦑".repeat(Math.max(0, lives)) || "💀";
            if (lives <= 0) gameOver();
          }
        }
      }

      // draw world
      for (const p of plankton) {
        const pulse = 1 + Math.sin(t * 4 + p.phase) * 0.25;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * pulse, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.color}, 0.9)`;
        ctx.shadowColor = `rgba(${p.color}, 1)`;
        ctx.shadowBlur = 16;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      for (const j of jellies) drawJelly(j, t);
      if (state !== "start") drawSquid(t);

      // score pops
      ctx.textAlign = "center";
      ctx.font = "700 15px 'Space Grotesk', sans-serif";
      for (let i = pops.length - 1; i >= 0; i--) {
        const p = pops[i];
        p.y -= 30 * dt;
        p.alpha -= dt * 1.4;
        if (p.alpha <= 0) { pops.splice(i, 1); continue; }
        ctx.fillStyle = `rgba(${p.color}, ${p.alpha})`;
        ctx.fillText(p.text, p.x, p.y);
      }

      ctx.restore();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    function gameOver() {
      state = "over";
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem("squid-best", String(best)); } catch (e) {}
      }
      overlayTitle.textContent = "THE DEEP RECLAIMS YOU";
      overlayText.textContent = score >= best && score > 0
        ? "A new record. The squid remembers its finest feeding."
        : "The jellies got the better of it. The squid does not blame you. Much.";
      overlayScore.textContent = score + " SNACKS";
      overlayScore.classList.remove("hidden");
      document.getElementById("start").textContent = "feed again";
      overlay.classList.remove("hidden");
    }

    // --- input ---------------------------------------------------------
    addEventListener("pointermove", (e) => { target.x = e.clientX; target.y = e.clientY; });
    document.getElementById("start").addEventListener("click", () => {
      ensureAudio();
      reset();
      state = "play";
      overlay.classList.add("hidden");
      blip(523, 0.2, 0.1);
    });
    const soundBtn = document.getElementById("sound");
    soundBtn.addEventListener("click", () => {
      soundOn = !soundOn;
      if (soundOn) ensureAudio();
      soundBtn.textContent = `sound: ${soundOn ? "on" : "off"}`;
    });
  </script>
</body>
</html>
